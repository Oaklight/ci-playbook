name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install dev deps so ty system hook is on PATH
      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff + ty)
        uses: pre-commit/action@v3.0.1
        env:
          SKIP: complexipy

      - name: Complexity check (advisory)
        if: always()
        run: pre-commit run complexipy --all-files || true

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev,test]"

      - name: Run tests
        run: pytest tests/ -v
